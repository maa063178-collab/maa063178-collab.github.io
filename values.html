<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قيمة في موقف — البرنامج الذكي</title><link rel="stylesheet" href="style.css"><style>:root{--a:#f28a32;--b:#d75c2e}</style></head><body>
<header><h1>قيمة في موقف — البرنامج الذكي</h1><div class="meta">مدرسة درويش بن كرم — مدير المدرسة: الأستاذ أحمد عبد الله الصبحي</div><div class="meta">قياس فهم القيمة وتطبيقها في موقف واقعي</div></header>
<div class="wrap"><div class="grid"><div class="card kpi"><span>عدد التقييمات</span><b id="k1">0</b></div><div class="card kpi"><span>متوسط الدرجة /2</span><b id="k2">0</b></div><div class="card kpi"><span>نسبة الإتقان</span><b id="k3">0</b></div><div class="card kpi"><span>طلاب يحتاجون دعمًا</span><b id="k4">0</b></div></div>
<div class="title">إدخال التقييم</div><div class="card"><form><div class="field"><label>التاريخ</label><input id="date" type="date"></div><div class="field"><label>اسم الطالب</label><input id="name"></div><div class="field"><label>الصف/الشعبة</label><input id="cls"></div><div class="field"><label>مرحلة القياس</label><select id="stage"><option>قبلي</option><option>أثناء التنفيذ</option><option>بعدي</option></select></div><div class="field"><label>القيمة المستهدفة</label><input id="value"></div><div class="field"><label>حدد القيمة؟</label><select id="identify"><option value="0">0</option><option value="1">1</option></select></div><div class="field"><label>فسر/طبق القيمة؟</label><select id="apply"><option value="0">0</option><option value="1">1</option></select></div><div class="field"><label>نوع الدليل</label><select id="evidence"><option>إجابة موقف</option><option>ملاحظة سلوكية</option><option>منتج طالب</option><option>تأمل/كتابة</option></select></div><div class="field full"><label>وصف الموقف</label><textarea id="scenario"></textarea></div></form><div class="actions no-print"><button onclick="add()">حفظ التقييم</button><button class="secondary" onclick="clearForm()">مسح الحقول</button></div></div>
<div class="two"><div><div class="title">السجلات</div><div class="card"><div class="toolbar no-print"><button class="secondary" onclick="dl('values.csv',csv(),'text/csv')">تصدير CSV</button><button class="secondary" onclick="backup()">نسخة احتياطية</button><label class="btn secondary">استيراد<input type="file" hidden onchange="restore(this)"></label><button class="secondary" onclick="window.print()">طباعة تقرير</button><button class="danger" onclick="wipe()">مسح الكل</button></div><div class="table"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>القيمة</th><th>المرحلة</th><th>حدد</th><th>طبق</th><th>الدليل</th><th class="no-print">حذف</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div><div class="title">التحليل الذكي</div><div class="card"><div id="insights"></div><canvas id="chart"></canvas></div></div></div></div>
<script>const C={key:'smart_values_rows',fields:[{id:'date',label:'التاريخ',type:'date'},{id:'name',label:'اسم الطالب'},{id:'cls',label:'الصف/الشعبة'},{id:'stage',label:'مرحلة القياس',type:'select'},{id:'value',label:'القيمة المستهدفة'},{id:'identify',label:'حدد القيمة',type:'select'},{id:'apply',label:'فسر/طبق',type:'select'},{id:'evidence',label:'نوع الدليل',type:'select'},{id:'scenario',label:'وصف الموقف'}],required:['date','name','value'],cols:['date','name','value','stage','identify','apply','evidence'],analyze:(rows,pct,draw,esc)=>{let total=rows.length,s=r=>(+r.identify)+(+r.apply),avg=total?rows.reduce((a,r)=>a+s(r),0)/total:0,m=rows.filter(r=>s(r)===2).length,by={};rows.forEach(r=>(by[r.name]??=[]).push(s(r)));let low=Object.entries(by).filter(x=>x[1].reduce((a,b)=>a+b,0)/x[1].length<1.5),pre=rows.filter(r=>r.stage==='قبلي'),post=rows.filter(r=>r.stage==='بعدي'),av=a=>a.length?a.reduce((x,r)=>x+s(r),0)/a.length:0,ins=[];if(!total)ins.push('ابدأ بموقف قبلي قصير ثم كرر موقفًا مماثلًا بعد التنفيذ.');if(pre.length&&post.length)ins.push('التغير بين القياس القبلي والبعدي: <b>'+((av(post)-av(pre)).toFixed(2))+' درجة</b> من 2.');if(low.length)ins.push('<b>طلاب يحتاجون دعمًا:</b> '+low.map(x=>esc(x[0])).join('، '));draw(['قبلي','بعدي'],[Math.round(av(pre)*50),Math.round(av(post)*50)]);return{k:[total,avg.toFixed(2),pct(m,total)+'%',low.length],ins}}};</script></div><script src="app.js"></script></body></html>
