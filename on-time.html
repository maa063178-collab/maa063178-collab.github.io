<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نبدأ في الموعد — البرنامج الذكي</title><link rel="stylesheet" href="style.css"><style>:root{--a:#129a9a;--b:#1967a3}</style></head><body>
<header><h1>نبدأ في الموعد — البرنامج الذكي</h1><div class="meta">مدرسة درويش بن كرم — مدير المدرسة: الأستاذ أحمد عبد الله الصبحي</div><div class="meta">متابعة الحضور والوصول للحصة الأولى وقياس التحسن</div></header>
<div class="wrap"><div class="grid"><div class="card kpi"><span>إجمالي السجلات</span><b id="k1">0</b></div><div class="card kpi"><span>نسبة الحضور</span><b id="k2">0</b></div><div class="card kpi"><span>الوصول في الموعد</span><b id="k3">0</b></div><div class="card kpi"><span>طلاب يحتاجون متابعة</span><b id="k4">0</b></div></div>
<div class="title">إدخال البيانات</div><div class="card"><form><div class="field"><label>التاريخ</label><input id="date" type="date"></div><div class="field"><label>اسم الطالب</label><input id="name"></div><div class="field"><label>الصف/الشعبة</label><input id="cls"></div><div class="field"><label>الحضور</label><select id="present"><option>حاضر</option><option>غائب</option></select></div><div class="field"><label>وصل للحصة الأولى في الموعد؟</label><select id="ontime"><option>نعم</option><option>لا</option></select></div><div class="field"><label>دقائق التأخر</label><input id="late" type="number"></div><div class="field"><label>سبب التأخر</label><input id="reason"></div><div class="field"><label>الإجراء/الدعم</label><input id="action"></div><div class="field full"><label>ملاحظات</label><textarea id="notes"></textarea></div></form><div class="actions no-print"><button onclick="add()">حفظ السجل</button><button class="secondary" onclick="clearForm()">مسح الحقول</button></div></div>
<div class="two"><div><div class="title">السجلات</div><div class="card"><div class="toolbar no-print"><button class="secondary" onclick="dl('on-time.csv',csv(),'text/csv')">تصدير CSV</button><button class="secondary" onclick="backup()">نسخة احتياطية</button><label class="btn secondary">استيراد<input type="file" hidden onchange="restore(this)"></label><button class="secondary" onclick="window.print()">طباعة تقرير</button><button class="danger" onclick="wipe()">مسح الكل</button></div><div class="table"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>الصف</th><th>الحضور</th><th>في الموعد</th><th>التأخر</th><th>الإجراء</th><th class="no-print">حذف</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div><div class="title">التحليل الذكي</div><div class="card"><div id="insights"></div><canvas id="chart"></canvas></div></div></div></div>
<script>const C={key:'smart_punctuality_rows',fields:[{id:'date',label:'التاريخ',type:'date'},{id:'name',label:'اسم الطالب'},{id:'cls',label:'الصف/الشعبة'},{id:'present',label:'الحضور',type:'select'},{id:'ontime',label:'في الموعد',type:'select'},{id:'late',label:'دقائق التأخر',type:'number'},{id:'reason',label:'سبب التأخر'},{id:'action',label:'الإجراء/الدعم'},{id:'notes',label:'ملاحظات'}],required:['date','name'],cols:['date','name','cls','present','ontime','late','action'],analyze:(rows,pct,draw,esc)=>{let total=rows.length,p=rows.filter(r=>r.present==='حاضر').length,o=rows.filter(r=>r.present==='حاضر'&&r.ontime==='نعم').length,by={};rows.forEach(r=>{if(r.present==='حاضر'&&r.ontime==='لا')by[r.name]=(by[r.name]||0)+1});let f=Object.entries(by).filter(x=>x[1]>=2),op=pct(o,p),ins=[rows.length?('معدل الوصول في الموعد <b>'+op+'%</b>.'):'ابدأ بخط أساس لمدة خمسة أيام ثم استمر في المتابعة الأسبوعية.'];if(f.length)ins.push('<b>تنبيه متابعة:</b> '+f.map(x=>esc(x[0])+' ('+x[1]+')').join('، '));draw(['الحضور','في الموعد'],[pct(p,total),op]);return{k:[total,pct(p,total)+'%',op+'%',f.length],ins}}};</script></div><script src="app.js"></script></body></html>
