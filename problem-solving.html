<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فكرة تحل مشكلة — البرنامج الذكي</title><link rel="stylesheet" href="style.css"><style>:root{--a:#7552c7;--b:#4b56a8}</style></head><body>
<header><h1>فكرة تحل مشكلة — البرنامج الذكي</h1><div class="meta">مدرسة درويش بن كرم — مدير المدرسة: الأستاذ أحمد عبد الله الصبحي</div><div class="meta">رصد المشكلة وتجربة الحل وقياس الأثر</div></header>
<div class="wrap"><div class="grid"><div class="card kpi"><span>عدد المشكلات المرصودة</span><b id="k1">0</b></div><div class="card kpi"><span>متوسط خط الأساس</span><b id="k2">0</b></div><div class="card kpi"><span>متوسط القياس النهائي</span><b id="k3">0</b></div><div class="card kpi"><span>نسبة التحسن</span><b id="k4">0</b></div></div>
<div class="title">إدخال التجربة</div><div class="card"><form><div class="field"><label>التاريخ</label><input id="date" type="date"></div><div class="field"><label>اسم الفريق/الطلاب</label><input id="team"></div><div class="field"><label>المشكلة المرصودة</label><input id="problem"></div><div class="field"><label>مكان الرصد</label><input id="place"></div><div class="field"><label>خط الأساس</label><input id="baseline" type="number"></div><div class="field"><label>القياس النهائي</label><input id="final" type="number"></div><div class="field"><label>الحل المجرب</label><input id="solution"></div><div class="field"><label>حالة التجربة</label><select id="status"><option>قيد التجربة</option><option>ناجحة</option><option>تحتاج تعديل</option><option>متوقفة</option></select></div><div class="field full"><label>القرار / الملاحظات</label><textarea id="decision"></textarea></div></form><div class="actions no-print"><button onclick="add()">حفظ التجربة</button><button class="secondary" onclick="clearForm()">مسح الحقول</button></div></div>
<div class="two"><div><div class="title">السجلات</div><div class="card"><div class="toolbar no-print"><button class="secondary" onclick="dl('problems.csv',csv(),'text/csv')">تصدير CSV</button><button class="secondary" onclick="backup()">نسخة احتياطية</button><label class="btn secondary">استيراد<input type="file" hidden onchange="restore(this)"></label><button class="secondary" onclick="window.print()">طباعة تقرير</button><button class="danger" onclick="wipe()">مسح الكل</button></div><div class="table"><table><thead><tr><th>المشكلة</th><th>الفريق</th><th>خط الأساس</th><th>النهائي</th><th>الحالة</th><th class="no-print">حذف</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div><div class="title">التحليل الذكي</div><div class="card"><div id="insights"></div><canvas id="chart"></canvas></div></div></div></div>
<script>const C={key:'smart_problems_rows',fields:[{id:'date',label:'التاريخ',type:'date'},{id:'team',label:'الفريق'},{id:'problem',label:'المشكلة'},{id:'place',label:'مكان الرصد'},{id:'baseline',label:'خط الأساس',type:'number'},{id:'final',label:'القياس النهائي',type:'number'},{id:'solution',label:'الحل'},{id:'status',label:'الحالة',type:'select'},{id:'decision',label:'القرار'}],required:['date','team','problem'],cols:['problem','team','baseline','final','status'],analyze:(rows,pct,draw,esc)=>{let total=rows.length,av=k=>total?rows.reduce((a,r)=>a+(+r[k]),0)/total:0,b=av('baseline'),f=av('final'),imp=b?Math.round((b-f)/b*100):0,ins=[];if(!total)ins.push('ابدأ برصد المشكلة عدديًا كخط أساس ثم جرّب حلًا واحدًا قابلًا للقياس.');else{ins.push('التحسن الكلي التقريبي: <b>'+imp+'%</b>.');let need=rows.filter(r=>+r.baseline>0?Math.round((r.baseline-r.final)/r.baseline*100)<10:true);if(need.length)ins.push('<b>تجارب تحتاج مراجعة:</b> '+need.map(r=>esc(r.problem)).join('، '))}draw(['خط الأساس','النهائي'],[Math.round(b),Math.round(f)],Math.max(100,Math.ceil(Math.max(b,f)/10)*10||100));return{k:[total,b.toFixed(1),f.toFixed(1),imp+'%'],ins}}};</script></div><script src="app.js"></script></body></html>
