<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قيمة في موقف — البرنامج الذكي</title><style>:root{--a:#f28a32;--b:#d75c2e}body{margin:0;font-family:Tahoma,Arial,sans-serif;direction:rtl;background:#f4f7fb;color:#1f2b3d}*{box-sizing:border-box}header{padding:24px 28px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 4px 14px #0002}h1{margin:0 0 6px;font-size:28px}.meta{font-size:14px;opacity:.95}.wrap{max-width:1220px;margin:18px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #dce4ee;border-radius:16px;padding:16px;box-shadow:0 3px 12px #0000000c}.kpi b{display:block;font-size:28px;color:var(--a);margin-top:6px}.kpi span,label,.muted{font-size:13px;color:#687386}.title{font-size:20px;font-weight:700;color:#17345f;margin:22px 0 10px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:9px;border:1px solid #dce4ee;border-radius:10px;background:#fff}textarea{min-height:72px;resize:vertical}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button,.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--a);color:#fff;font-weight:700;text-decoration:none;display:inline-block}.secondary{background:#eef2f7;color:#17345f;border:1px solid #dce4ee}.danger{background:#fff0f0;color:#b83232;border:1px solid #efcaca}.table{max-height:350px;overflow:auto;border:1px solid #dce4ee;border-radius:12px;margin-top:10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e3e8ef;text-align:right;vertical-align:top}th{background:#f8fafc;color:#17345f;position:sticky;top:0}.insight{padding:12px;border-right:4px solid var(--a);background:#f8fafc;border-radius:10px;margin:8px 0}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.ok{background:#e7f6ef;color:#137a58}.warn{background:#fff4df;color:#ad6a00}.bad{background:#fdecec;color:#b83232}canvas{width:100%;height:220px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}form{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,form{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:22px}}@media print{body{background:#fff}.no-print,form,.actions,.toolbar{display:none!important}.wrap{max-width:none}.card{box-shadow:none}.table{max-height:none;overflow:visible}}</style></head><body>
<header><h1>قيمة في موقف — البرنامج الذكي</h1><div class="meta">مدرسة درويش بن كرم — مدير المدرسة: الأستاذ أحمد عبد الله الصبحي</div><div class="meta">قياس قبلي/بعدي وفهم القيمة وتطبيقها في موقف واقعي</div></header>
<div class="wrap"><div class="grid"><div class="card kpi"><span>عدد التقييمات</span><b id="k1">0</b></div><div class="card kpi"><span>متوسط الدرجة /2</span><b id="k2">0</b></div><div class="card kpi"><span>نسبة الإتقان</span><b id="k3">0</b></div><div class="card kpi"><span>طلاب يحتاجون دعمًا</span><b id="k4">0</b></div></div>
<div class="title">إدخال البيانات</div><div class="card"><form id="f"><div class="field"><label>التاريخ</label><input id="date" type="date"></div><div class="field"><label>اسم الطالب</label><input id="name" type="text"></div><div class="field"><label>الصف/الشعبة</label><input id="cls" type="text"></div><div class="field"><label>مرحلة القياس</label><select id="stage"><option>قبلي</option><option>أثناء التنفيذ</option><option>بعدي</option></select></div><div class="field"><label>القيمة المستهدفة</label><input id="value" type="text"></div><div class="field"><label>حدد القيمة؟ (0/1)</label><select id="identify"><option>0</option><option>1</option></select></div><div class="field"><label>فسر/طبق القيمة؟ (0/1)</label><select id="apply"><option>0</option><option>1</option></select></div><div class="field"><label>نوع الدليل</label><select id="evidence"><option>إجابة موقف</option><option>ملاحظة سلوكية</option><option>منتج طالب</option><option>تأمل/كتابة</option></select></div><div class="field full"><label>وصف الموقف أو الملاحظة</label><textarea id="scenario"></textarea></div></form><div class="actions no-print"><button onclick="add()">حفظ السجل</button><button class="secondary" onclick="clearForm()">مسح الحقول</button></div></div>
<div class="two"><div><div class="title">السجلات</div><div class="card"><div class="toolbar no-print"><button class="secondary" onclick="download(C.id+'.csv',csv(),'text/csv')">تصدير CSV</button><button class="secondary" onclick="backup()">نسخة احتياطية</button><label class="btn secondary">استيراد<input type="file" hidden onchange="restore(this)"></label><button class="secondary" onclick="window.print()">طباعة تقرير</button><button class="danger" onclick="wipe()">مسح الكل</button></div><div class="table"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>القيمة</th><th>المرحلة</th><th>الدرجة</th><th>الدليل</th><th class="no-print">حذف</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div><div class="title">التحليل الذكي</div><div class="card"><div id="insights"></div><canvas id="chart"></canvas></div></div></div></div>
<script>const CONFIG={"id": "values", "title": "قيمة في موقف — البرنامج الذكي", "subtitle": "قياس قبلي/بعدي وفهم القيمة وتطبيقها في موقف واقعي", "kpis": ["عدد التقييمات", "متوسط الدرجة /2", "نسبة الإتقان", "طلاب يحتاجون دعمًا"], "fields": [{"id": "date", "label": "التاريخ", "type": "date"}, {"id": "name", "label": "اسم الطالب", "type": "text"}, {"id": "cls", "label": "الصف/الشعبة", "type": "text"}, {"id": "stage", "label": "مرحلة القياس", "type": "select", "options": ["قبلي", "أثناء التنفيذ", "بعدي"]}, {"id": "value", "label": "القيمة المستهدفة", "type": "text"}, {"id": "identify", "label": "حدد القيمة؟ (0/1)", "type": "select", "options": ["0", "1"]}, {"id": "apply", "label": "فسر/طبق القيمة؟ (0/1)", "type": "select", "options": ["0", "1"]}, {"id": "evidence", "label": "نوع الدليل", "type": "select", "options": ["إجابة موقف", "ملاحظة سلوكية", "منتج طالب", "تأمل/كتابة"]}, {"id": "scenario", "label": "وصف الموقف أو الملاحظة", "type": "textarea", "full": true}], "required": ["date", "name", "value"], "columns": [{"id": "date", "label": "التاريخ"}, {"id": "name", "label": "الطالب"}, {"id": "value", "label": "القيمة"}, {"id": "stage", "label": "المرحلة"}, {"id": "score", "label": "الدرجة", "value": r=>(+r.identify)+(+r.apply)}, {"id": "evidence", "label": "الدليل"}]};const C=CONFIG, KEY='smart_'+C.id+'_rows'; let rows=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(rows))} function pct(a,b){return b?Math.round(a/b*100):0}
function collect(){let r={};C.fields.forEach(f=>{let e=$(f.id),v=e.value;if(f.type==='number')v=+v||0;r[f.id]=v});return r}
function clearForm(){C.fields.forEach(f=>{let e=$(f.id); if(f.type==='date')e.value=new Date().toISOString().slice(0,10); else if(f.type==='select')e.selectedIndex=0; else e.value=''} )}
function add(){let r=collect();for(const id of C.required){if(!String(r[id]??'').trim()){alert('يرجى استكمال الحقول الأساسية');return}}rows.push(r);save();clearForm();render()}
function del(i){rows.splice(i,1);save();render()} function wipe(){if(confirm('هل تريد مسح جميع بيانات هذه المبادرة؟')){rows=[];save();render()}}
function csv(){if(!rows.length)return '';let ks=C.fields.map(f=>f.id),head=C.fields.map(f=>'\"'+f.label+'\"').join(',');let body=rows.map(r=>ks.map(k=>'\"'+String(r[k]??'').replaceAll('\"','\"\"')+'\"').join(',')).join('\n');return '\uFEFF'+head+'\n'+body}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function backup(){download(C.id+'_backup.json',JSON.stringify(rows,null,2),'application/json')}
function restore(inp){let f=inp.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{rows=JSON.parse(rd.result);save();render();alert('تم الاستيراد بنجاح')}catch(e){alert('الملف غير صالح')}};rd.readAsText(f)}
function draw(labels,vals,max){let c=$('chart'),ctx=c.getContext('2d'),w=c.clientWidth||500,h=220,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;ctx.scale(d,d);ctx.clearRect(0,0,w,h);let pad=34,bw=(w-pad*2)/(Math.max(vals.length,1)*1.6);ctx.font='12px Tahoma';ctx.textAlign='center';vals.forEach((v,i)=>{let x=pad+i*bw*1.6,bh=(h-70)*(Math.max(0,Math.min(max,v))/max),y=h-34-bh;ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--a').trim();ctx.fillRect(x,y,bw,bh);ctx.fillStyle='#1f2b3d';ctx.fillText(String(v),x+bw/2,y-6);ctx.fillText(labels[i],x+bw/2,h-14)})}
function analyze(){
 if(C.id==='punctuality'){let total=rows.length,pres=rows.filter(r=>r.present==='حاضر').length,on=rows.filter(r=>r.present==='حاضر'&&r.ontime==='نعم').length;let by={};rows.forEach(r=>{if(r.present==='حاضر'&&r.ontime==='لا')by[r.name]=(by[r.name]||0)+1});let follow=Object.entries(by).filter(x=>x[1]>=2);let late=rows.filter(r=>r.late>0);let k=[total,pct(pres,total)+'%',pct(on,pres)+'%',follow.length];let ins=[];let op=pct(on,pres);ins.push(rows.length?`معدل الوصول في الموعد <b>${op}%</b>. ${op>=90?'الأداء مرتفع؛ حافظ على التعزيز والمتابعة.':op>=75?'الأداء متوسط؛ ركّز على أسباب التأخر المتكررة.':'توجد فجوة واضحة؛ نفّذ تدخلًا مركزًا مع الحالات المتكررة.'}`:'ابدأ بخط أساس لمدة خمسة أيام ثم استمر في المتابعة الأسبوعية.');if(follow.length)ins.push('<b>تنبيه متابعة:</b> '+follow.map(x=>esc(x[0])+' ('+x[1]+')').join('، '));if(late.length)ins.push('متوسط التأخر للحالات المتأخرة: <b>'+Math.round(late.reduce((a,r)=>a+r.late,0)/late.length)+' دقيقة</b>.');draw(['الحضور','في الموعد'],[pct(pres,total),op],100);return [k,ins]}
 if(C.id==='values'){let total=rows.length,avg=total?(rows.reduce((a,r)=>a+(+r.identify)+(+r.apply),0)/total):0,master=rows.filter(r=>(+r.identify)+(+r.apply)===2).length;let by={};rows.forEach(r=>(by[r.name]??=[]).push((+r.identify)+(+r.apply)));let low=Object.entries(by).filter(x=>x[1].reduce((a,b)=>a+b,0)/x[1].length<1.5);let pre=rows.filter(r=>r.stage==='قبلي'),post=rows.filter(r=>r.stage==='بعدي'),av=a=>a.length?a.reduce((s,r)=>s+(+r.identify)+(+r.apply),0)/a.length:0;let ins=[];if(!total)ins.push('ابدأ بموقف قبلي قصير، ثم كرر موقفًا مماثلًا بعد التنفيذ للمقارنة.');if(pre.length&&post.length){let d=(av(post)-av(pre)).toFixed(2);ins.push(`التغير بين القياس القبلي والبعدي: <b>${d>0?'+':''}${d} درجة</b> من 2.`)}if(low.length)ins.push('<b>طلاب يحتاجون دعمًا:</b> '+low.map(x=>esc(x[0])).join('، '));let vals={};rows.forEach(r=>(vals[r.value]??=[]).push((+r.identify)+(+r.apply)));let weak=Object.entries(vals).sort((a,b)=>(a[1].reduce((x,y)=>x+y,0)/a[1].length)-(b[1].reduce((x,y)=>x+y,0)/b[1].length))[0];if(weak)ins.push('القيمة الأقل متوسطًا حاليًا: <b>'+esc(weak[0])+'</b>. زد المواقف التطبيقية المرتبطة بها.');draw(['قبلي','بعدي'],[Math.round(av(pre)*50),Math.round(av(post)*50)],100);return [[total,avg.toFixed(2),pct(master,total)+'%',low.length],ins]}
 let total=rows.length,av=k=>total?rows.reduce((a,r)=>a+(+r[k]),0)/total:0,b=av('baseline'),f=av('final'),imp=b?Math.round((b-f)/b*100):0;let need=rows.filter(r=>+r.baseline>0?Math.round((r.baseline-r.final)/r.baseline*100)<10:true);let ins=[];if(!total)ins.push('ابدأ برصد المشكلة عدديًا لعدة أيام كخط أساس، ثم جرّب حلًا واحدًا قابلًا للقياس.');else{ins.push(`التحسن الكلي التقريبي: <b>${imp}%</b>. ${imp>=20?'النتيجة تدعم استمرار الحل وتوثيقه.':imp>0?'يوجد تحسن محدود؛ راجع خطوات التنفيذ قبل التوسع.':'لا يظهر تحسن حتى الآن؛ يفضّل تعديل الحل أو طريقة التنفيذ.'}`);if(need.length)ins.push('<b>تجارب تحتاج مراجعة:</b> '+need.map(r=>esc(r.problem)).join('، '));ins.push('التجارب المصنفة ناجحة: <b>'+rows.filter(r=>r.status==='ناجحة').length+'</b> من '+total+'.')}draw(['خط الأساس','النهائي'],[Math.round(b),Math.round(f)],Math.max(100,Math.ceil(Math.max(b,f)/10)*10||100));return [[total,b.toFixed(1),f.toFixed(1),imp+'%'],ins]}
function render(){let [k,ins]=analyze();k.forEach((v,i)=>$('k'+(i+1)).textContent=v);$('insights').innerHTML=ins.map(x=>'<div class="insight">'+x+'</div>').join('');$('rows').innerHTML=rows.slice().reverse().map((r,ri)=>{let i=rows.length-1-ri;return '<tr>'+C.columns.map(c=>'<td>'+esc(typeof c.value==='function'?c.value(r):r[c.id])+'</td>').join('')+'<td class="no-print"><button class="danger" onclick="del('+i+')">حذف</button></td></tr>'}).join('')}
document.addEventListener('DOMContentLoaded',()=>{C.fields.forEach(f=>{if(f.type==='date')$(f.id).value=new Date().toISOString().slice(0,10)});render()})</script></body></html>
